<section class="page" style="height: calc(100vh - 144px); display: flex; flex-direction: column; overflow: hidden">
  <div class="hero" style="flex-shrink: 0">
    <p class="label">工作空间</p>
    <h1>文件浏览</h1>
  </div>

  <div class="files-layout" style="flex: 1; display: flex; overflow: hidden; gap: 0; margin: 0 -20px">
    <div class="files-sidebar" @contextmenu="handleRootContextMenu($event)">
      <div class="files-sidebar__header">
        <span style="font-weight: 600; font-size: 13px; color: var(--color-text-secondary)">文件列表</span>
        <div style="display: flex; gap: 4px">
          <el-button size="small" text @click="startCreate('')" title="新建">➕</el-button>
          <el-button size="small" text @click="loadTree()" title="刷新">🔄</el-button>
        </div>
      </div>
      <div class="files-sidebar__body" v-loading="loading">
        <div v-if="creating === ''" class="files-tree-row files-tree-row--creating" style="padding-left: 12px">
          <input v-model="newName" class="files-tree-input" placeholder="名称..." @blur="confirmCreate(false)"
            @keyup.enter="confirmCreate(false)" @keyup.escape="creating = null" autofocus />
          <div style="display: flex; gap: 2px; flex-shrink: 0">
            <el-button size="small" text @mousedown.prevent="confirmCreate(false)">📄</el-button>
            <el-button size="small" text @mousedown.prevent="confirmCreate(true)">📁</el-button>
          </div>
        </div>
        <div v-if="flatNodes.length === 0 && !loading && creating !== ''"
          style="padding: 20px; text-align: center; color: var(--color-text-muted); font-size: 13px">
          空目录，右键创建文件
        </div>
        <template v-for="item in flatNodes" :key="item.node.path">
          <template v-if="creating === item.node.path">
            <div class="files-tree-row files-tree-row--creating"
              :style="{ paddingLeft: (item.depth * 16 + 12 + 16) + 'px' }">
              <input v-model="newName" class="files-tree-input" placeholder="名称..." @blur="confirmCreate(false)"
                @keyup.enter="confirmCreate(false)" @keyup.escape="creating = null" autofocus />
              <div style="display: flex; gap: 2px; flex-shrink: 0">
                <el-button size="small" text @mousedown.prevent="confirmCreate(false)">📄</el-button>
                <el-button size="small" text @mousedown.prevent="confirmCreate(true)">📁</el-button>
              </div>
            </div>
          </template>
          <div v-else-if="renaming === item.node.path" class="files-tree-row"
            :class="{ 'is-active': selectedNode?.path === item.node.path }"
            :style="{ paddingLeft: (item.depth * 16 + 12) + 'px' }">
            <span class="files-tree-icon">{{ item.node.is_dir ? (expandedDirs.has(item.node.path) ? '📂' : '📁') : '📄'
              }}</span>
            <input v-model="renameValue" class="files-tree-input" @blur="confirmRename" @keyup.enter="confirmRename"
              @keyup.escape="renaming = null" autofocus />
          </div>
          <div v-else class="files-tree-row" :class="{ 'is-active': selectedNode?.path === item.node.path }"
            :style="{ paddingLeft: (item.depth * 16 + 12) + 'px' }" @click="selectNode(item.node)"
            @contextmenu="onContextMenu($event, item.node)">
            <span class="files-tree-icon">{{ item.node.is_dir ? (expandedDirs.has(item.node.path) ? '📂' : '📁') : '📄'
              }}</span>
            <span class="files-tree-name" :title="item.node.path">{{ item.node.name }}</span>
            <span v-if="!item.node.is_dir" class="files-tree-size">{{ formatSize(item.node.size) }}</span>
          </div>
        </template>
      </div>
    </div>

    <div class="files-main">
      <div v-if="!selectedNode" class="files-main__empty">
        <div style="font-size: 48px; margin-bottom: 12px">📂</div>
        <div style="color: var(--color-text-muted)">选择左侧文件即可预览或编辑</div>
        <div style="font-size: 12px; color: var(--color-text-muted); margin-top: 4px">右键文件树可新建、重命名、删除</div>
      </div>

      <template v-else-if="selectedNode.is_dir">
        <div class="files-main__header">
          <span>📁 {{ selectedNode.name }}</span>
          <div style="display: flex; gap: 6px">
            <el-button size="small" @click="startCreate(selectedNode.path)">+ 新建</el-button>
          </div>
        </div>
        <div class="files-main__dir-preview">
          <span>这是一个目录</span>
          <el-button size="small" style="margin-left: 12px" @click="startCreate(selectedNode.path)">+ 新建文件</el-button>
        </div>
      </template>

      <template v-else>
        <div class="files-main__header">
          <span>📄 {{ selectedNode.name }}</span>
          <span style="font-size: 11px; color: var(--color-text-muted)">{{ formatSize(selectedNode.size) }}</span>
          <div style="margin-left: auto; display: flex; gap: 6px">
            <el-button size="small" type="primary" :loading="saving" @click="saveFile">保存</el-button>
            <el-button size="small" @click="deleteNode(selectedNode)" type="danger" text>删除</el-button>
          </div>
        </div>
        <div class="files-main__editor" v-loading="fileLoading">
          <textarea v-model="fileContent" class="files-editor-textarea" spellcheck="false"
            @keydown.ctrl.s.prevent="saveFile"></textarea>
        </div>
      </template>
    </div>
  </div>
</section>
