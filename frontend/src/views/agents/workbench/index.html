<section class="page" style="height: calc(100vh - 115px); display: flex; flex-direction: column; overflow: hidden">
  <div class="workbench-toolbar">
    <el-select v-model="selectedIds" multiple filterable placeholder="选择智能体..." style="flex: 1" :disabled="sending"
      popper-class="workbench-select-popper">
      <el-option v-for="a in agents" :key="a.id" :label="`${a.name} (${a.model_name || '无模型'})`" :value="a.id" />
    </el-select>
    <span v-if="selectedIds.length" style="font-size: 12px; color: var(--color-text-muted); white-space: nowrap">
      {{ selectedIds.length }} 个智能体
    </span>
  </div>

  <div v-if="selectedIds.length === 0"
    style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--color-text-muted)">
    <div style="text-align: center">
      <div style="font-size: 48px; margin-bottom: 12px">🤖</div>
      <div>从上方下拉框选择智能体开始对话</div>
      <div style="font-size: 12px; margin-top: 4px">可多选，消息会同时发送给所有选中智能体</div>
    </div>
  </div>

  <div v-else class="workbench-panels" :style="{ gridTemplateColumns: columnsStyle }">
    <div v-for="panel in panels" :key="panel.agent.id" class="workbench-panel">
      <div class="workbench-panel__header">
        <div>
          <span style="font-weight: 600; font-size: 13px">{{ panel.agent.name }}</span>
          <span style="font-size: 11px; color: var(--color-text-muted); margin-left: 6px">{{ panel.agent.model_name ||
            '无模型' }}</span>
        </div>
        <div style="display: flex; gap: 4px; align-items: center">
          <span v-if="panel.streaming"
            style="width: 8px; height: 8px; border-radius: 50%; background: var(--color-accent-primary); animation: pulse 1s infinite"></span>
          <el-button v-if="panel.streaming" size="small" type="danger" text @click="stopPanel(panel)">⏹</el-button>
          <el-button size="small" text
            @click="selectedIds = selectedIds.filter(id => id !== panel.agent.id)">✕</el-button>
        </div>
      </div>

      <div class="workbench-panel__messages" :ref="(el) => setMessagesRef(panel, el)"
        @scroll="onPanelScroll(panel, $event)">
        <div v-if="panel.loading && panel.messages.length === 0"
          style="text-align: center; padding: 20px; color: var(--color-text-muted); font-size: 12px">
          加载中...
        </div>
        <div v-else-if="panel.hasMore && !panel.loading"
          style="text-align: center; padding: 4px; font-size: 11px; color: var(--color-text-muted)">
          ↑ 向上滚动加载历史
        </div>

        <template v-for="msg in panel.messages" :key="msg.id || msg.created_at">
          <div class="workbench-msg" :class="'workbench-msg--' + msg.role">
            <div class="workbench-msg__role">{{ msg.role === 'user' ? '你' : panel.agent.name }}</div>
            <div class="workbench-msg__content">
              <div v-html="renderContent(msg.content)" style="line-height: 1.6"></div>

              <div v-if="msg.tool_calls_json && msg.tool_calls_json !== '[]'"
                style="margin-top: 6px; font-size: 11px; color: var(--color-text-muted)">
                <div v-for="(tc, i) in parseToolCalls(msg.tool_calls_json)" :key="i"
                  style="padding: 2px 6px; margin: 2px 0; background: var(--color-bg-input); border-radius: 4px; display: inline-block; margin-right: 4px">
                  🔧 {{ tc.name }}
                </div>
              </div>
            </div>
            <div class="workbench-msg__time">{{ formatTime(msg.created_at) }}</div>
          </div>
        </template>

        <div v-if="panel.streaming && panel.streamToolCalls.length > 0" style="padding: 4px 12px">
          <div v-for="(tc, i) in panel.streamToolCalls" :key="i"
            style="font-size: 11px; color: var(--color-accent-secondary); margin-bottom: 2px">
            🔧 {{ tc.tool }} ({{ tc.args }})
          </div>
        </div>
      </div>
    </div>
  </div>

  <div v-if="selectedIds.length > 0" class="workbench-input">
    <el-input v-model="input" type="textarea" :rows="2" placeholder="输入消息，将同时发送给所有选中的智能体..." :disabled="sending"
      resize="none" @keydown.enter.exact.prevent="send()" />
    <el-button type="primary" :loading="sending" :disabled="!input.trim()" @click="send()"
      style="margin-left: 8px; align-self: flex-end; height: 60px">
      发送
    </el-button>
  </div>
</section>
