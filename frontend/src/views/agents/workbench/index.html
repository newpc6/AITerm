<section class="page" style="height: calc(100vh - 115px); display: flex; flex-direction: column; overflow: hidden">
  <div class="workbench-toolbar">
    <el-select v-model="selectedIds" multiple filterable placeholder="选择智能体..." style="flex: 1" :disabled="sending">
      <el-option v-for="a in agents" :key="a.id" :label="agentLabel(a)" :value="a.id" />
    </el-select>
  </div>

  <div v-if="selectedIds.length === 0"
    style="flex: 1; display: flex; align-items: center; justify-content: center; color: var(--color-text-muted)">
    <div style="text-align: center">
      <div style="font-size: 48px; margin-bottom: 12px">🤖</div>
      <div>从上方下拉框选择智能体开始对话</div>
    </div>
  </div>

  <template v-else>
    <div class="workbench-tabs">
      <div v-for="id in selectedIds" :key="id" class="workbench-tab" :class="{ 'is-active': activeTab === id }"
        @click="activeTab = id">
        <span class="workbench-tab__name">{{ getPanel(id) ? getPanel(id).agent.name : id }}</span>
        <span v-if="getPanel(id) && getPanel(id).streaming" class="workbench-tab__dot"></span>
        <span class="workbench-tab__close" @click.stop="closeTab(id)">✕</span>
      </div>
    </div>

    <div class="workbench-body">
      <div v-for="id in selectedIds" :key="id" class="workbench-chat" :class="{ 'is-hidden': activeTab !== id }">
        <template v-if="getPanel(id)">
          <div class="workbench-chat__messages" :ref="getRef(id)" @scroll="onPanelScroll(getPanel(id), $event)">
            <div v-if="getPanel(id).loading && getPanel(id).messages.length === 0" class="workbench-chat__hint">加载中...
            </div>
            <div v-else-if="getPanel(id).hasMore && !getPanel(id).loading" class="workbench-chat__hint">↑ 向上滚动加载历史</div>

            <div v-for="msg in getPanel(id).messages" :key="msg.id || msg.created_at" class="workbench-msg"
              :class="'workbench-msg--' + msg.role">
              <div class="workbench-msg__role">{{ msg.role === 'user' ? '你' : getPanel(id).agent.name }}</div>
              <div class="workbench-msg__content">
                <div v-html="renderContent(msg.content)" style="line-height: 1.6"></div>
                <div v-if="msg.tool_calls_json && msg.tool_calls_json !== '[]'" class="workbench-msg__tools">
                  <span v-for="(tc, i) in parseToolCalls(msg.tool_calls_json)" :key="i" class="workbench-msg__tool">🔧
                    {{ tc.name }}</span>
                </div>
              </div>
              <div class="workbench-msg__time">{{ formatTime(msg.created_at) }}</div>
            </div>

            <div v-if="getPanel(id).streaming && getPanel(id).streamToolCalls.length > 0"
              class="workbench-msg__live-tools">
              <div v-for="(tc, i) in getPanel(id).streamToolCalls" :key="i">🔧 {{ tc.tool }} ({{ tc.args }})</div>
            </div>
          </div>

          <div class="workbench-chat__input">
            <el-input v-model="input" type="textarea" :rows="2" placeholder="输入消息..." :disabled="sending" resize="none"
              @keydown.enter.exact.prevent="send(getPanel(id))" />
            <div class="workbench-chat__actions">
              <el-button v-if="getPanel(id).streaming" type="danger" size="small" @click="stopPanel(getPanel(id))">⏹
                停止</el-button>
              <el-button type="primary" size="small" :loading="sending" :disabled="!input.trim()"
                @click="send(getPanel(id))">发送</el-button>
            </div>
          </div>
        </template>
      </div>
    </div>
  </template>
</section>
