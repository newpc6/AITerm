<section class="login-page">
  <div class="card login-card">
    <div class="hero">
      <p class="label">登录</p>
      <h1>进入 AITerm</h1>
      <p>启用登录保护后，需要先登录才能访问工作区。</p>
    </div>

    <el-alert v-if="errorMessage" :title="errorMessage" type="warning" show-icon :closable="false" />

    <el-form label-position="top">
      <el-form-item label="用户名">
        <el-input v-model="form.username" placeholder="请输入用户名" :disabled="loading || submitting" />
      </el-form-item>
      <el-form-item label="密码">
        <el-input
          v-model="form.password"
          type="password"
          show-password
          placeholder="请输入密码"
          :disabled="loading || submitting"
          @keyup.enter="submitLogin"
        />
      </el-form-item>
    </el-form>

    <div class="login-actions">
      <el-button type="primary" :loading="submitting" @click="submitLogin">登录</el-button>
    </div>
  </div>
</section>
