<section class="page">
  <div class="hero">
    <p class="label">个人</p>
    <h1>个人中心</h1>
  </div>

  <div v-loading="loading" class="card" style="max-width: 600px">
    <div v-if="user" style="display: flex; flex-direction: column; gap: 20px">
      <div>
        <p class="label">用户名</p>
        <div class="value" style="font-size: 18px">{{ user.username }}</div>
      </div>

      <div>
        <p class="label">显示名</p>
        <el-input v-model="displayName" :disabled="saving" style="max-width: 300px" placeholder="输入显示名" />
        <el-button type="primary" :loading="saving" style="margin-top: 8px" @click="saveDisplayName">保存</el-button>
      </div>

      <div>
        <p class="label">角色</p>
        <el-tag :type="user.role === 'admin' ? 'danger' : 'info'">{{ user.role === 'admin' ? '管理员' : '普通用户' }}</el-tag>
      </div>

      <div>
        <p class="label">最后登录</p>
        <span style="color: var(--color-text-secondary)">{{ user.last_login_at || '-' }}</span>
      </div>

      <div>
        <p class="label">注册时间</p>
        <span style="color: var(--color-text-secondary)">{{ user.created_at || '-' }}</span>
      </div>

      <div>
        <el-button type="primary" @click="openPasswordDialog">修改密码</el-button>
      </div>
    </div>

    <div v-else>
      <p style="color: var(--color-text-muted)">未登录</p>
    </div>
  </div>

  <el-dialog v-model="passwordDialogVisible" title="修改密码" width="420px">
    <el-alert v-if="passwordErrorMessage" :title="passwordErrorMessage" type="warning" show-icon :closable="false" />
    <el-form label-position="top">
      <el-form-item label="当前密码">
        <el-input v-model="passwordForm.current_password" type="password" show-password :disabled="passwordSaving" />
      </el-form-item>
      <el-form-item label="新密码">
        <el-input v-model="passwordForm.new_password" type="password" show-password :disabled="passwordSaving" />
      </el-form-item>
      <el-form-item label="确认新密码">
        <el-input v-model="passwordForm.confirm_password" type="password" show-password :disabled="passwordSaving" />
      </el-form-item>
    </el-form>
    <template #footer>
      <el-button :disabled="passwordSaving" @click="passwordDialogVisible = false">取消</el-button>
      <el-button type="primary" :loading="passwordSaving" @click="submitPasswordChange">保存</el-button>
    </template>
  </el-dialog>
</section>
