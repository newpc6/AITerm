<section class="page">
  <div class="hero">
    <p class="label">设置</p>
    <h1>配置中心</h1>
    <p>提示词配置已对接后端接口。</p>
  </div>

  <el-alert v-if="errorMessage" :title="errorMessage" type="warning" show-icon :closable="false" />

  <el-alert v-if="successMessage" :title="successMessage" type="success" show-icon :closable="false" />

  <div class="card">
    <div class="settings-header">
      <div>
        <p class="label">提示词配置</p>
        <div class="value">{{ currentModel }}</div>
      </div>
      <el-button :loading="loading" @click="loadSettings">刷新</el-button>
    </div>
    <SettingsPanel
      :command-blacklist-text="commandBlacklistText"
      :command-whitelist-text="commandWhitelistText"
      :form="form"
      :loading="loading"
      :saving="saving"
      :settings="settings"
      @update:command-blacklist-text="commandBlacklistText = $event"
      @update:command-whitelist-text="commandWhitelistText = $event"
      @reset="resetForm"
      @save="saveSettings"
    />
  </div>

  <div class="card">
    <div class="settings-header">
      <div>
        <p class="label">登录设置</p>
        <div class="value">{{ authForm.enabled ? '已启用' : '未启用' }}</div>
      </div>
    </div>
    <AuthSettingsPanel
      :form="authForm"
      :loading="loading"
      :saving="authSaving"
      :settings="authSettings"
      @reset="resetAuthForm"
      @save="saveAuthConfig"
    />
  </div>
</section>
