<section class="page">
  <div class="hero">
    <p class="label">节点</p>
    <h1>服务器节点</h1>
    <p>管理服务器节点，支持添加、编辑和删除操作。</p>
  </div>

  <el-alert v-if="errorMessage" :title="errorMessage" type="warning" show-icon :closable="false" />
  <el-alert v-if="successMessage" :title="successMessage" type="success" show-icon :closable="false" />

  <div class="card">
    <div class="page-header">
      <div>
        <p class="label">节点列表</p>
        <div class="value">{{ nodeCount }} 个节点</div>
      </div>
      <div class="page-header__actions">
        <el-button :loading="loading" @click="loadNodes">刷新</el-button>
        <el-button type="primary" @click="startCreateNode">添加节点</el-button>
      </div>
    </div>
    <NodeTable :nodes="nodes" :loading="loading" @edit="startEditNode" @delete="removeNode" />
  </div>

  <el-dialog v-model="dialogVisible" :title="dialogTitle" width="480px" :close-on-click-modal="false">
    <NodeForm :form="form" :editing="isEditing" :loading="loading" :saving="saving" @cancel="closeDialog" @save="saveNode" />
  </el-dialog>
</section>
