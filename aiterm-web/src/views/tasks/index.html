<section class="page">
  <div class="hero">
    <p class="label">任务</p>
    <h1>任务中心</h1>
    <p>查看和管理所有任务。</p>
  </div>

  <el-alert v-if="errorMessage" :title="errorMessage" type="warning" show-icon :closable="false" />
  <el-alert v-if="successMessage" :title="successMessage" type="success" show-icon :closable="false" />

  <div class="card">
    <div class="tasks-header">
      <div>
        <p class="label">任务列表</p>
        <div class="value">{{ tasks.length }} 个任务</div>
      </div>
      <el-button :loading="loading" @click="loadTasks">刷新</el-button>
    </div>
    <TaskTable :tasks="tasks" :loading="loading" :deleting-task-id="deletingTaskId" @delete="removeTask" />
  </div>
</section>
