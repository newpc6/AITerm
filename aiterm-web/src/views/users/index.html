<section class="page">
  <div class="hero">
    <p class="label">用户</p>
    <h1>用户管理</h1>
    <p>管理登录使用的本地用户，数据持久化到 sqlite。</p>
  </div>

  <el-alert v-if="errorMessage" :title="errorMessage" type="warning" show-icon :closable="false" />
  <el-alert v-if="successMessage" :title="successMessage" type="success" show-icon :closable="false" />

  <div class="card">
    <div class="page-header">
      <div>
        <p class="label">用户列表</p>
        <div class="value">{{ userCount }} 个用户</div>
      </div>
      <div class="page-header__actions">
        <el-button :loading="loading" @click="loadUsers">刷新</el-button>
        <el-button type="primary" @click="startCreateUser">新建用户</el-button>
      </div>
    </div>
    <UserTable :items="users" :loading="loading" @edit="startEditUser" @reset-password="resetPassword"
      @delete="removeUser" />
    <Pagination :page="page" :page-size="pageSize" :total="total" @update:page="handlePageChange"
      @update:page-size="handlePageSizeChange" />
  </div>

  <el-dialog v-model="dialogVisible" :title="dialogTitle" width="480px" :close-on-click-modal="false">
    <UserForm :form="form" :editing="isEditing" :loading="loading" :saving="saving" @cancel="closeDialog"
      @save="saveUser" />
  </el-dialog>
</section>
